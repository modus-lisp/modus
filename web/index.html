<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Modus in the browser</title>
<!-- Cross-origin isolation on hosts (GitHub Pages) that cannot set COOP/COEP
     headers.  Must load before the app script. -->
<script src="coi-serviceworker.js"></script>
<style>
  html, body { height: 100%; margin: 0; background: #111; color: #ddd; font: 14px/1.35 ui-monospace, Menlo, Consolas, monospace; }
  #term { box-sizing: border-box; height: calc(100% - 2.2em); padding: 8px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
  #bar { height: 2.2em; display: flex; align-items: center; gap: 8px; padding: 0 8px; background: #222; border-top: 1px solid #333; }
  #in { flex: 1; background: #000; color: #eee; border: 1px solid #444; padding: 3px 6px; font: inherit; }
  #status { color: #8a8; min-width: 14em; }
  #files { color: #aac; font-size: 12px; }
  #files a { color: #9cf; margin-right: 8px; }
  #drop { color: #667; font-size: 12px; margin-left: auto; }
  body.dragging #term { outline: 2px dashed #6a6; outline-offset: -4px; }
  .log { color: #789; }
  .err { color: #e77; }
  #compl { position: fixed; z-index: 10; background: #1a1a1a; border: 1px solid #555; max-height: 42vh; overflow-y: auto; font-size: 13px; display: none; box-shadow: 0 -4px 12px #0008; }
  #compl div { padding: 1px 8px; white-space: pre; cursor: pointer; }
  #compl div.sel { background: #2b4; color: #000; }
  #extoggle { cursor: pointer; color: #9c9; user-select: none; }
  #explorer { position: fixed; top: 0; right: 0; bottom: 2.2em; width: 320px; background: #161616; border-left: 1px solid #333; display: none; flex-direction: column; z-index: 5; }
  #explorer.open { display: flex; }
  #exfilter { margin: 6px; background: #000; color: #eee; border: 1px solid #444; padding: 3px 6px; font: inherit; }
  #exlist { flex: 1; overflow-y: auto; font-size: 13px; }
  #exlist div { padding: 1px 8px; cursor: pointer; white-space: pre; }
  #exlist div:hover { background: #222; }
  #exdetail { border-top: 1px solid #333; padding: 8px; font-size: 12px; min-height: 6em; }
  #exdetail .k { display: inline-block; padding: 0 6px; border-radius: 3px; font-size: 11px; color: #eee; }
  #exdetail .k.function { background: #24506b; } #exdetail .k.macro { background: #6b4a24; }
  #exdetail .k.special-operator { background: #5b2b6b; } #exdetail .k.variable { background: #2b6b3b; } #exdetail .k.unknown { background: #444; }
  #exdetail button { margin: 6px 6px 0 0; background: #333; color: #ddd; border: 1px solid #555; padding: 2px 8px; cursor: pointer; font: inherit; }
  body.explorer #term { margin-right: 320px; }
</style>
</head>
<body>
<div id="term"></div>
<div id="bar">
  <span id="status">loading…</span>
  <input id="in" placeholder="type a form and press Enter" autocomplete="off" spellcheck="false" disabled>
  <span id="extoggle" title="symbol explorer">&#9776; symbols</span>
  <span id="files"></span>
  <label id="drop">drop files here or <input id="pick" type="file" multiple style="width:5em"></label>
</div>
<div id="compl"></div>
<div id="explorer">
  <input id="exfilter" placeholder="filter symbols…" autocomplete="off" spellcheck="false">
  <div id="exlist"></div>
  <div id="exdetail">click a symbol to inspect it</div>
</div>
<script>
(async () => {
  console.log('page script start; isolated=' + crossOriginIsolated);
  const term = document.getElementById('term');
  const input = document.getElementById('in');
  const status = document.getElementById('status');
  const dec = new TextDecoder();
  const say = (text, cls) => {
    console.log((cls ? cls + ': ' : '') + text.replace(/\n$/, ''));
    const s = document.createElement('span');
    if (cls) s.className = cls;
    s.textContent = text;
    term.appendChild(s);
    term.scrollTop = term.scrollHeight;
  };
  if (!crossOriginIsolated) {
    // coi-serviceworker.js registers a worker and reloads once; the reloaded
    // page is isolated.  Wait quietly for that unless it reported it cannot.
    if (window.coiStatus === 'unavailable') {
      say('This page needs cross-origin isolation (COOP/COEP), which requires either\n'
        + 'those response headers or a service worker over https. Neither is available\n'
        + 'here. Serve with web/serve.js, or open the GitHub Pages URL over https.\n', 'err');
      status.textContent = 'not isolated';
    } else {
      status.textContent = 'enabling cross-origin isolation…';
    }
    return;
  }
  // Try BASE.gz first (GitHub Pages ships gzipped artifacts), then BASE
  // (local dev via serve.js has the plain files).
  const fetchBytes = async (base, label) => {
    status.textContent = 'fetching ' + label + '…';
    for (const url of [base + '.gz', base]) {
      const r = await fetch(url);
      if (!r.ok) continue;
      let stream = r.body;
      if (url.endsWith('.gz')) stream = stream.pipeThrough(new DecompressionStream('gzip'));
      return await new Response(stream).arrayBuffer();
    }
    return null;
  };
  const mvmw = await fetchBytes('modus.mvmw', 'bytecode');
  if (!mvmw) { say('modus.mvmw not found: run sbcl --script mvm/build-web.lisp\n', 'err'); return; }
  const core = await fetchBytes('modus.core', 'core');
  if (!core) say('(no core snapshot: cold boot takes a long time)\n', 'log');

  // http relay: the worker parks a request here and blocks; we fetch it.
  const HTTP_CAP = 16 << 20;
  const httpSab = new SharedArrayBuffer(16 + HTTP_CAP);
  const httpCtl = new Int32Array(httpSab, 0, 4), httpBuf = new Uint8Array(httpSab, 16);
  const serveHttp = async (m) => {
    let raw;
    try {
      const r = await fetch(m.url, { method: m.method, headers: Object.fromEntries(Object.entries(m.headers).filter(([k]) => !/^(host|connection|content-length)$/i.test(k))), body: m.body || undefined, redirect: 'follow' });
      const body = new Uint8Array(await r.arrayBuffer());
      let head = `HTTP/1.0 ${r.status} ${r.statusText || 'OK'}\r\n`;
      r.headers.forEach((v, k) => { if (!/^(transfer-encoding|content-encoding|content-length)$/i.test(k)) head += `${k}: ${v}\r\n`; });
      head += `Content-Length: ${body.length}\r\n\r\n`;
      const hb = enc.encode(head);
      raw = new Uint8Array(hb.length + body.length); raw.set(hb); raw.set(body, hb.length);
    } catch (e) {
      raw = enc.encode(`HTTP/1.0 502 Bad Gateway\r\nX-Error: ${String(e.message || e).replace(/[\r\n]/g, ' ')}\r\nContent-Length: 0\r\n\r\n`);
    }
    const n = Math.min(raw.length, HTTP_CAP);
    httpBuf.set(raw.subarray(0, n));
    Atomics.store(httpCtl, 1, n);
    Atomics.store(httpCtl, 0, 2);
    Atomics.notify(httpCtl, 0);
  };

  // inbox: files dropped on the page, picked up by the worker at its next read
  const INBOX_CAP = 32 << 20;
  const inboxSab = new SharedArrayBuffer(16 + INBOX_CAP);
  const inboxCtl = new Int32Array(inboxSab, 0, 4), inboxBuf = new Uint8Array(inboxSab, 16);
  const addFile = (name, bytes) => {
    const nb = enc.encode(name);
    let p = Atomics.load(inboxCtl, 1);
    if (p + 8 + nb.length + bytes.length > INBOX_CAP) { say(`[inbox full, ${name} dropped]\n`, 'err'); return; }
    const dv = new DataView(inboxSab, 16);
    dv.setUint32(p, nb.length, true); p += 4; inboxBuf.set(nb, p); p += nb.length;
    dv.setUint32(p, bytes.length, true); p += 4; inboxBuf.set(bytes, p); p += bytes.length;
    Atomics.store(inboxCtl, 1, p);
    Atomics.add(inboxCtl, 0, 1);
    say(`[queued ${name}, ${bytes.length} bytes; picked up at the next prompt]\n`, 'log');
  };
  window.modusAddFile = (name, text) => addFile(name, enc.encode(text));
  const takeFiles = async (list) => { for (const f of list) addFile(f.name, new Uint8Array(await f.arrayBuffer())); };
  document.getElementById('pick').addEventListener('change', (ev) => takeFiles(ev.target.files));
  document.body.addEventListener('dragover', (ev) => { ev.preventDefault(); document.body.classList.add('dragging'); });
  document.body.addEventListener('dragleave', () => document.body.classList.remove('dragging'));
  document.body.addEventListener('drop', (ev) => { ev.preventDefault(); document.body.classList.remove('dragging'); takeFiles(ev.dataTransfer.files); });

  // files the program wrote: offered as downloads
  const filesEl = document.getElementById('files');
  const offerFile = (path, bytes) => {
    const name = path.slice(path.lastIndexOf('/') + 1);
    let a = filesEl.querySelector(`a[data-path="${CSS.escape(path)}"]`);
    if (!a) { a = document.createElement('a'); a.dataset.path = path; a.download = name; filesEl.appendChild(a); }
    if (a.href) URL.revokeObjectURL(a.href);
    a.href = URL.createObjectURL(new Blob([bytes]));
    a.textContent = `${name} (${bytes.length}b)`;
    console.log(`log: [wrote ${path}, ${bytes.length} bytes]`);
  };

  // stdin ring buffer shared with the worker
  const RING = 65536, HDR = 16;
  const sab = new SharedArrayBuffer(HDR + RING);
  const ctl = new Int32Array(sab, 0, 4);
  const ring = new Uint8Array(sab, HDR);
  const enc = new TextEncoder();
  const feed = (text) => {
    const bytes = enc.encode(text);
    let tail = Atomics.load(ctl, 1);
    for (const b of bytes) {
      const next = (tail + 1) % RING;
      while (next === Atomics.load(ctl, 0)) { /* full: spin briefly */ }
      ring[tail] = b; tail = next;
    }
    Atomics.store(ctl, 1, tail);
    Atomics.notify(ctl, 1);
  };

  // hooks for scripted drivers (web/t/headless.js)
  window.modusFeed = feed;
  window.modusClose = () => { Atomics.store(ctl, 2, 1); Atomics.notify(ctl, 1); };
  const worker = new Worker('worker.js');
  worker.onmessage = (ev) => {
    const m = ev.data;
    if (m.type === 'stdout') say(dec.decode(m.bytes));
    else if (m.type === 'log') say(m.text + '\n', 'log');
    else if (m.type === 'waiting') { status.textContent = 'ready'; input.disabled = false; input.focus(); console.log('log: [ready]'); }
    else if (m.type === 'exit') { say(`\n[modus exited with code ${m.code}]\n`, 'log'); status.textContent = 'exited'; input.disabled = true; }
    else if (m.type === 'fault') { say('\n' + m.text + '\n', 'err'); status.textContent = 'faulted'; input.disabled = true; }
    else if (m.type === 'http') { status.textContent = 'fetching ' + m.url; serveHttp(m); }
    else if (m.type === 'file') offerFile(m.path, m.bytes);
    else if (m.type === 'query-result') { if (window.modusQueryResult) window.modusQueryResult(m); }
  };
  // --- introspection query channel (completion + explorer) -----------------
  // The worker services these while blocked reading stdin (see host-browser).
  const QCAP = 16384;
  const querySab = new SharedArrayBuffer(16 + QCAP);
  const queryCtl = new Int32Array(querySab, 0, 4);   // [state, id, reqLen]
  const queryBuf = new Uint8Array(querySab, 16);
  let queryId = 0, qInFlight = null;
  const qQueued = new Map();                          // tag -> {op, arg, resolve}
  const pumpQuery = () => {
    if (qInFlight || Atomics.load(queryCtl, 0) !== 0) return;
    const e = qQueued.entries().next();
    if (e.done) return;
    const [, q] = e.value; qQueued.delete(e.value[0]);
    const argBytes = enc.encode(q.arg);
    if (argBytes.length + 2 > QCAP) { q.resolve(''); return pumpQuery(); }
    queryBuf[0] = q.op.charCodeAt(0);
    queryBuf.set(argBytes, 1);
    Atomics.store(queryCtl, 1, ++queryId);
    Atomics.store(queryCtl, 2, 1 + argBytes.length);
    Atomics.store(queryCtl, 0, 1);
    Atomics.notify(ctl, 1);                           // wake the worker if idle in read
    qInFlight = { id: queryId, resolve: q.resolve };
  };
  // Ask the image; coalesces by TAG (latest wins) so fast typing doesn't queue.
  const query = (op, arg, tag) => new Promise((resolve) => {
    const t = tag || ('u' + (++queryId));
    const prev = qQueued.get(t); if (prev) prev.resolve('');
    qQueued.set(t, { op, arg, resolve });
    pumpQuery();
  });
  window.modusQuery = query;   // test hook
  window.modusQueryResult = (m) => {
    if (qInFlight && m.id === qInFlight.id) { const r = qInFlight; qInFlight = null; r.resolve(m.error ? '' : dec.decode(m.bytes)); pumpQuery(); }
  };

  // --- tab completion on the REPL input -----------------------------------
  const compl = document.getElementById('compl');
  let cItems = [], cSel = -1, cToken = '';
  const TOKEN_RE = /[A-Za-z0-9\-*+/<>=!?%&.:$_]+$/;
  const curToken = () => { const m = TOKEN_RE.exec(input.value.slice(0, input.selectionStart)); return m ? m[0] : ''; };
  const closeCompl = () => { compl.style.display = 'none'; cItems = []; cSel = -1; };
  const renderCompl = () => {
    if (!cItems.length) { closeCompl(); return; }
    compl.innerHTML = '';
    cItems.forEach((name, i) => {
      const d = document.createElement('div'); d.textContent = name;
      if (i === cSel) d.className = 'sel';
      d.addEventListener('mousedown', (ev) => { ev.preventDefault(); acceptCompl(i); });
      compl.appendChild(d);
    });
    const r = input.getBoundingClientRect();
    compl.style.left = r.left + 'px';
    compl.style.width = Math.max(220, r.width) + 'px';
    compl.style.bottom = (window.innerHeight - r.top) + 'px';
    compl.style.display = 'block';
    const sel = compl.querySelector('.sel'); if (sel) sel.scrollIntoView({ block: 'nearest' });
  };
  const acceptCompl = (i) => {
    const name = cItems[i]; if (name === undefined) return;
    const start = input.selectionStart - cToken.length;
    input.value = input.value.slice(0, start) + name + input.value.slice(input.selectionStart);
    const pos = start + name.length; input.setSelectionRange(pos, pos);
    closeCompl(); input.focus();
  };
  let cTimer = null;
  const doComplete = async () => {
    const tok = curToken(); cToken = tok;
    if (tok.length < 1 || tok.length > 80) { closeCompl(); return; }
    const text = await query('c', tok, 'compl');
    if (curToken() !== tok) return;                   // user moved on
    cItems = (text ? text.split('\n').filter(Boolean).map((s) => s.toLowerCase()) : []).slice(0, 200);
    cSel = cItems.length ? 0 : -1;
    renderCompl();
  };
  input.addEventListener('input', () => { clearTimeout(cTimer); cTimer = setTimeout(doComplete, 70); });
  input.addEventListener('blur', () => setTimeout(closeCompl, 120));

  input.addEventListener('keydown', (ev) => {
    const open = compl.style.display === 'block' && cItems.length;
    if (ev.key === 'Tab') { ev.preventDefault(); if (open) acceptCompl(cSel < 0 ? 0 : cSel); else doComplete(); return; }
    if (open && (ev.key === 'ArrowDown' || ev.key === 'ArrowUp')) {
      ev.preventDefault();
      cSel = (cSel + (ev.key === 'ArrowDown' ? 1 : cItems.length - 1)) % cItems.length;
      renderCompl(); return;
    }
    if (ev.key === 'Escape') { if (open) { ev.preventDefault(); closeCompl(); } return; }
    if (ev.key === 'Enter') {
      if (open && cSel >= 0) { ev.preventDefault(); acceptCompl(cSel); return; }
      const line = input.value + '\n';
      input.value = ''; closeCompl();
      say(line); status.textContent = 'running…'; feed(line);
    }
  });

  // --- symbol explorer ----------------------------------------------------
  const explorer = document.getElementById('explorer');
  const exFilter = document.getElementById('exfilter');
  const exList = document.getElementById('exlist');
  const exDetail = document.getElementById('exdetail');
  let exTimer = null;
  const exSearch = async () => {
    const q = exFilter.value.trim();
    const text = q.length ? await query('a', q, 'exf') : '';
    const names = text ? text.split('\n').filter(Boolean) : [];
    exList.innerHTML = '';
    if (!names.length) { exList.innerHTML = '<div style="color:#667;padding:6px">' + (q.length ? 'no matches' : 'type to search symbols') + '</div>'; return; }
    names.slice(0, 500).forEach((name) => {
      const d = document.createElement('div'); d.textContent = name.toLowerCase();
      d.addEventListener('click', () => exDescribe(name));
      exList.appendChild(d);
    });
  };
  exFilter.addEventListener('input', () => { clearTimeout(exTimer); exTimer = setTimeout(exSearch, 130); });
  const exDescribe = async (name) => {
    const nm = name.toLowerCase();
    exDetail.textContent = 'describing ' + nm + '…';
    const text = await query('d', name, 'exd');
    const info = {};
    for (const line of text.split('\n')) { const t = line.indexOf('\t'); if (t > 0) info[line.slice(0, t)] = line.slice(t + 1); }
    const kind = info.kind || 'unknown';
    exDetail.innerHTML = '';
    const h = document.createElement('div');
    h.innerHTML = '<b></b> <span class="k"></span>';
    h.querySelector('b').textContent = nm;
    const ks = h.querySelector('.k'); ks.className = 'k ' + kind; ks.textContent = kind;
    exDetail.appendChild(h);
    if (info.value !== undefined) { const v = document.createElement('div'); v.style.marginTop = '4px'; v.style.wordBreak = 'break-all'; v.textContent = 'value: ' + info.value; exDetail.appendChild(v); }
    const mkBtn = (label, fn) => { const b = document.createElement('button'); b.textContent = label; b.addEventListener('click', fn); exDetail.appendChild(b); };
    mkBtn('insert', () => { const p = input.selectionStart; input.value = input.value.slice(0, p) + nm + input.value.slice(p); input.setSelectionRange(p + nm.length, p + nm.length); input.focus(); });
    mkBtn('describe', () => { const l = "(describe '" + nm + ")\n"; say(l); status.textContent = 'running…'; feed(l); });
    if (kind === 'variable') mkBtn('value', () => { const l = nm + '\n'; say(l); status.textContent = 'running…'; feed(l); });
  };
  document.getElementById('extoggle').addEventListener('click', () => {
    const open = explorer.classList.toggle('open');
    document.body.classList.toggle('explorer', open);
    if (open) { exFilter.focus(); exSearch(); }
  });
  status.textContent = 'starting…';
  // Deep links.  decodeURIComponent (not URLSearchParams) so a literal '+'
  // survives — Lisp forms are full of it; encode links with encodeURIComponent.
  const parseParams = (str) => str.split('&').filter(Boolean).map((part) => {
    const eq = part.indexOf('=');
    return eq < 0 ? [decodeURIComponent(part), ''] : [decodeURIComponent(part.slice(0, eq)), decodeURIComponent(part.slice(eq + 1))];
  });
  // ?eval=FORM (repeatable): batch — run and exit (used by the test harness).
  // #eval=FORM / #load=URL (repeatable, ordered): run at startup, then stay in
  //   the REPL, so a shared link sets things up and leaves you at a live prompt.
  //   load fetches the URL (relative to this page, or absolute; CORS applies)
  //   into the in-memory FS and LOADs it.
  const argv = ['modus'];
  const files = [];
  let quit = false;
  for (const [k, v] of parseParams(location.search.slice(1))) if (k === 'eval') { argv.push('--eval', v); quit = true; }
  for (const [k, v] of parseParams(location.hash.slice(1))) {
    if (k === 'eval') argv.push('--eval', v);
    else if (k === 'load') {
      status.textContent = 'fetching ' + v + '…';
      const buf = await fetch(v).then((r) => r.ok ? r.arrayBuffer() : null).catch(() => null);
      if (!buf) { say('link load: could not fetch ' + v + '\n', 'err'); continue; }
      const path = '/home/web/link-' + files.length + '.lisp';
      files.push({ path, bytes: buf });
      argv.push('--load', path);
    }
  }
  if (quit) argv.push('--quit');
  worker.postMessage({ type: 'start', mvmw, core, stdin: sab, http: httpSab, inbox: inboxSab, query: querySab, argv, env: ['HOME=/home/web'],
                       semispace: 256 << 20, files }, [mvmw].concat(core ? [core] : []).concat(files.map((f) => f.bytes)));
})();
</script>
</body>
</html>
